---
layout: default
---
{%- include i18n.html -%}
<article class="page">
  {% include page-header.html %}
  <div class="page-content">{{ content }}</div>

  
  <div class="archive-controls" data-archive-controls>
    <label>{{ U.search }}
      <input type="search" data-archive-search autocomplete="off">
    </label>
    <label>{{ U.year }}
      <select data-archive-year>
        <option value="">{{ U.all_years }}</option>
        {% assign years = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
        {% for year in years %}<option value="{{ year.name }}">{{ year.name }} ({{ year.items.size }})</option>{% endfor %}
      </select>
    </label>
    <label>{{ U.theme }}
      <select data-archive-topic>
        <option value="">{{ U.all_themes }}</option>
        <option value="screen">{{ U.th_screen }}</option>
        <option value="ai">{{ U.th_ai }}</option>
        <option value="education">{{ U.th_edu }}</option>
        <option value="work">{{ U.th_work }}</option>
      </select>
    </label>
  </div>
  <p class="archive-status" data-archive-status role="status" aria-live="polite"></p>
  <ul class="post-list" data-archive-list>
    {% for post in site.posts %}
    <li class="post-list-item" data-archive-item data-year="{{ post.date | date: '%Y' }}" data-search="{{ post.title | append: ' ' | append: post.excerpt | strip_html | downcase | escape }}">
      <a href="{{ post.url | relative_url }}">
        <span class="post-list-date">{{ post.date | date: T.datefmt }}</span>
        <span class="post-list-title">{{ post.title }}</span>
      </a>
      {% if post.excerpt %}<p class="post-list-excerpt">{{ post.excerpt | strip_html | truncatewords: 28 }}</p>{% endif %}
    </li>
    {% endfor %}
  </ul>
  <button class="archive-more" data-archive-more type="button" hidden>{{ U.more }}</button>
</article>
