---
layout: default
---
<article class="page">
  <header class="page-header">
    {% if page.cue %}<span class="cue">{{ page.cue }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.dek %}<p class="dek">{{ page.dek }}</p>{% endif %}
  </header>
  {% if site.show_subtitles and page.sub %}
  <div class="sub"><p>{{ page.sub | escape }}</p></div>
  {% endif %}
  <div class="page-content">
    {{ content }}
  </div>
</article>
