---
layout: default
---
<article class="post">
  <header class="post-header">
    <span class="cue">{{ page.date | date: "%d.%m.%Y" }}</span>
    <h1>{{ page.title }}</h1>
    {% if page.lang %}<p class="post-lang">Language: {{ page.lang }}</p>{% endif %}
    {% if page.source %}<p class="post-origin">Originally shared on {{ page.source | capitalize }}</p>{% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <footer class="post-footer">
    <a href="{{ '/journal/' | relative_url }}">&larr; Back to Journal</a>
  </footer>
</article>
