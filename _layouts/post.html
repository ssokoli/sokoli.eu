---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="cue">{{ page.date | date: "%-d %B %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.source %}<p class="post-origin">First published on {{ page.source | capitalize }}</p>{% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <footer class="post-footer">
    <a href="{{ '/journal/' | relative_url }}">All Journal posts</a>
  </footer>
</article>
