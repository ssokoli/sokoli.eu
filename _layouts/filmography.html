---
layout: default
---
{%- include i18n.html -%}
<article class="page">
  {% include page-header.html %}
  <div class="page-content">
    {{ content }}
  </div>
  {% assign works = site.data.filmography | sort: "year" | reverse %}
  <div class="grid grid-posters" style="margin-top:40px">
    {% for w in works %}{% include film-tile.html w=w name=true %}{% endfor %}
  </div>
  <p class="attribution">{{ U.attribution }} <a href="https://www.themoviedb.org/">themoviedb.org</a></p>
</article>
