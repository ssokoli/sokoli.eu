intro: "Είμαι ερευνήτρια οπτικοακουστικής μετάφρασης στο ΙΤΥΕ «Διόφαντος» και διδάσκω στο Ελληνικό Ανοικτό Πανεπιστήμιο, όπου κάνω μεταδιδακτορική έρευνα για την τεχνητή νοημοσύνη στην εκπαίδευση και στην οπτικοακουστική δημιουργία. Από το 2001 εργάζομαι επίσης ως δημιουργός υποτίτλων."
pages:
  about: |
    Είμαι ερευνήτρια, δημιουργός υποτίτλων και διδάσκουσα. Ζω στην Πάτρα.

    Εργάζομαι ως ερευνήτρια στο Ινστιτούτο Τεχνολογίας Υπολογιστών και Εκδόσεων «Διόφαντος» (ΙΤΥΕ), όπου από το 2011 συντονίζω ερευνητικά έργα. Από το 2025 κάνω επίσης μεταδιδακτορική έρευνα στο Ελληνικό Ανοικτό Πανεπιστήμιο, με θέμα την τεχνητή νοημοσύνη στην εκπαίδευση και στην οπτικοακουστική δημιουργία. Θέλω να μάθω τι κάνουν εφικτό αυτά τα εργαλεία, τι αντικαθιστούν και τι γίνεται με την επαγγελματική κρίση όταν τα χρησιμοποιούμε.

    Το πρώτο μου ερευνητικό ερώτημα προέκυψε από τον υποτιτλισμό. Οι δημιουργοί υποτίτλων παραλείπουν λέξεις συνεχώς, και ήθελα να μάθω ποιες και γιατί. Η απάντηση έγινε η διδακτορική μου διατριβή στο Αυτόνομο Πανεπιστήμιο της Βαρκελώνης (2011), που συγκρίνει τι παραλείπουν οι υπότιτλοι των ταινιών στην Ελλάδα και στην Ισπανία. Από τότε, αυτό που λείπει από τους υπότιτλους εξακολουθεί να με ενδιαφέρει.

    Τα ίδια χρόνια μελέτησα τον υποτιτλισμό ως τρόπο εκμάθησης γλωσσών. Συντόνισα δύο ευρωπαϊκά έργα, το Learning via Subtitling και το ClipFlair, όπου οι σπουδαστές εξασκούνται σε μια ξένη γλώσσα υποτιτλίζοντας και μεταγλωττίζοντας βίντεο. Αργότερα μελέτησα πώς μεταφράζονται οι ταινίες στις οποίες ακούγονται περισσότερες από μία γλώσσες.

    Άρχισα να μεταφράζω το 1995 και εργάστηκα ως διερμηνέας από το 1998 έως το 2008. Από το 2001 υποτιτλίζω ταινίες και σειρές στα ελληνικά, από τα αγγλικά, τα ισπανικά, τα ιταλικά, τα καταλανικά και τα γερμανικά. Από το 2016 είμαι επίσης υπεύθυνη ελληνικής γλώσσας (Greek Language Lead) για τον υποτιτλισμό στην Deluxe. Υποτιτλίζω ακόμη, και σε αυτή τη δουλειά βρίσκω ακόμη ερευνητικά ερωτήματα.

    Διδάσκω ισπανικά στο Ελληνικό Ανοικτό Πανεπιστήμιο. Έχω διδάξει υποτιτλισμό και τεχνολογία της μετάφρασης στο Πανεπιστήμιο Pompeu Fabra, στο Αυτόνομο Πανεπιστήμιο της Βαρκελώνης και αλλού. Τη δεκαετία του 1990 σπούδασα ψυχολογία, και τώρα διαβάζω τη σύγχρονη έρευνα για τη νόηση, τη μάθηση και την προσοχή.

    Έχω διδακτορικό και μεταπτυχιακό στη Μετάφραση και Διερμηνεία από το Αυτόνομο Πανεπιστήμιο της Βαρκελώνης και πτυχίο Αγγλικής Γλώσσας και Φιλολογίας από το Αριστοτέλειο Πανεπιστήμιο Θεσσαλονίκης. Είμαι αντιπρόεδρος της Ευρωπαϊκής Ένωσης Μελετών Οπτικοακουστικής Μετάφρασης (ESIST) και μέλος του AI Localization Think Tank.

    Στο σινεμά μένω μέχρι το τέλος των τίτλων, για να διαβάσω το όνομα του δημιουργού των υποτίτλων.
  subtitles: |
    Μια επιλογή από τις ταινίες και τις σειρές που έχω υποτιτλίσει ή ελέγξει στα ελληνικά από το 2001. Ο κατάλογος δεν είναι πλήρης. Προσθέτω τίτλους όσο τους βρίσκω στα αρχεία μου.

    Μεταφράζω από τα αγγλικά, τα ισπανικά, τα ιταλικά, τα καταλανικά και τα γερμανικά προς τα ελληνικά. Γράφω υπότιτλους, γράφω υπότιτλους για κωφούς και βαρήκοους θεατές (SDH) και ελέγχω τη δουλειά άλλων δημιουργών υποτίτλων.

    Όταν κάποιος τραγουδά στην οθόνη, προσπαθώ να γράφω υπότιτλους που τραγουδιούνται. Δεν ξέρω αν οι θεατές τραγουδούν μαζί στα ελληνικά. Εγώ πάντως τραγουδάω.

    Η χρονιά δίπλα σε κάθε τίτλο είναι συνήθως η χρονιά της ταινίας ή της σειράς, που συχνά είναι παλαιότερη από τη χρονιά που την υποτίτλισα.
  talks: |
    Προσκεκλημένες ομιλίες, κεντρικές ομιλίες, στρογγυλά τραπέζια και ανακοινώσεις σε συνέδρια από το 2000, στα ελληνικά, τα αγγλικά και τα ισπανικά.

    Τα τελευταία χρόνια οι περισσότερες προσκλήσεις αφορούν την τεχνητή νοημοσύνη στον υποτιτλισμό και στη μετάφραση. Οι παλαιότερες ομιλίες αφορούν τις νόρμες του υποτιτλισμού, τις πολύγλωσσες ταινίες και τον υποτιτλισμό στη διδασκαλία γλωσσών.

    Όπου υπάρχει βιντεοσκόπηση, μπορείτε να τη δείτε εδώ. Για τις υπόλοιπες ομιλίες βλέπετε την πρώτη διαφάνεια της παρουσίασής μου.
  research: |
    Οι δημοσιεύσεις μου, από την πιο πρόσφατη. Αφορούν τέσσερα θέματα:

    - πώς γράφονται οι υπότιτλοι και τι παραλείπουν
    - πώς μεταφράζονται οι ταινίες με περισσότερες από μία γλώσσες
    - τον υποτιτλισμό και τη μεταγλώττιση ως δραστηριότητες εκμάθησης γλωσσών
    - από το 2025, την τεχνητή νοημοσύνη στην εκπαίδευση και στην οπτικοακουστική δημιουργία

    Η διδακτορική μου διατριβή, *Subtitling Norms in Greece and Spain* (Αυτόνομο Πανεπιστήμιο της Βαρκελώνης, 2011), συγκρίνει τις δύο χώρες σε δύο σημεία: τι παραλείπουν οι υπότιτλοι των ταινιών και πώς μοιράζεται ο διάλογος σε υπότιτλους.

    Κάθε τίτλος οδηγεί στη σελίδα του εκδότη ή στο πλήρες κείμενο, όταν διατίθεται ελεύθερα.
  journal: |
    Μεγαλύτερα κείμενα, τα περισσότερα πρωτοδημοσιευμένα στο LinkedIn. Τα κρατώ εδώ για να μπορεί ο καθένας να τα βρει και να τα διαβάσει χωρίς λογαριασμό.
  notes: |
    Σύντομες αναρτήσεις από το X και το LinkedIn, από το 2012 μέχρι σήμερα, με τις νεότερες πρώτες. Καθεμία καταγράφει τι σκεφτόμουν μια συγκεκριμένη μέρα. Κάποιες θα τις έγραφα αλλιώς σήμερα.
  teaching: |
    Διδάσκω από το 2000. Στο Ελληνικό Ανοικτό Πανεπιστήμιο διδάσκω ισπανικά. Σε μεταπτυχιακά προγράμματα και επαγγελματικά σεμινάρια στην Ελλάδα, την Ισπανία, την Ιταλία και την Αργεντινή έχω διδάξει υποτιτλισμό, οπτικοακουστική μετάφραση και τεχνολογία της μετάφρασης.

    Με συναδέλφους στο UNED της Μαδρίτης έχω επίσης συμμετάσχει σε έργα διδακτικής καινοτομίας, όπου οι φοιτητές μαθαίνουν μια γλώσσα υποτιτλίζοντας, μεταγλωττίζοντας και περιγράφοντας βίντεο.
  projects: |
    Ερευνητικά έργα που έχω συντονίσει ή στα οποία έχω συμμετάσχει από το 2003. Τα περισσότερα χρηματοδοτήθηκαν από την Ευρωπαϊκή Ένωση.

    Από το 2003 έως το 2008 ήμουν υπεύθυνη έργων στο Ελληνικό Ανοικτό Πανεπιστήμιο. Από το 2011 συντονίζω έργα στο ΙΤΥΕ «Διόφαντος».
  contact: |
    Γράψτε μου με email ή στο [LinkedIn](https://www.linkedin.com/in/sokoli/) για υποτιτλισμό, ομιλίες, έρευνα ή διδασκαλία.

    Μπορείτε να γράψετε στα ελληνικά, τα αγγλικά ή τα ισπανικά.
