intro: "I am a senior researcher in audiovisual translation at the Computer Technology Institute “Diophantus” and a lecturer at the Hellenic Open University, where my postdoctoral research is on AI in education and audiovisual creation. I have also worked as a subtitle author since 2001."
pages:
  about: |
    I am a researcher, a subtitle author and a teacher. I live in Patras, Greece.

    I am a senior researcher at the Computer Technology Institute and Press "Diophantus" (CTI), where I have coordinated research projects since 2011. Since 2025 I have also been doing postdoctoral research at the Hellenic Open University on artificial intelligence in education and audiovisual creation. I want to know what these tools make possible, what they replace, and what happens to professional judgement when people use them.

    My first research question came from subtitling. Subtitle authors leave words out all the time, and I wanted to know which words, and why. The answer became my PhD thesis at the Universitat Autònoma de Barcelona (2011), which compares what film subtitles omit in Greece and in Spain. I have been interested in what subtitles leave out ever since.

    During the same years I studied subtitling as a way of learning languages. I coordinated two European projects, Learning via Subtitling and ClipFlair, in which students practise a foreign language by subtitling and revoicing video clips. Later I studied how films with more than one language are translated.

    I started translating in 1995 and worked as an interpreter from 1998 to 2008. Since 2001 I have subtitled films and series into Greek, from English, Spanish, Italian, Catalan and German. Since 2016 I have also been Greek Language Lead for subtitling at Deluxe. I still subtitle, and I still find research questions in that work.

    I teach Spanish at the Hellenic Open University. I have taught subtitling and translation technology at the Universitat Pompeu Fabra, the Universitat Autònoma de Barcelona and other universities. I studied psychology in the 1990s, and I am now reading current research on cognition, learning and attention.

    I hold a PhD and an MA in Translation and Interpretation from the Universitat Autònoma de Barcelona, and a BA in English Language and Literature from the Aristotle University of Thessaloniki. I am Vice President of the European Association for Studies in Screen Translation (ESIST) and a member of the AI Localization Think Tank.

    At the cinema I stay until the end of the credits, to read the name of the subtitle author.
  subtitles: |
    A selection of the films and series I have subtitled or reviewed in Greek since 2001. The list is not complete. I add titles as I find them in my records.

    I work from English, Spanish, Italian, Catalan and German into Greek. I write subtitles, I write subtitles for deaf and hard-of-hearing viewers (SDH), and I check the work of other subtitle authors.

    When someone sings on screen, I try to write subtitles that can be sung. I do not know whether viewers sing along in Greek. I do.

    The year next to each title is usually the year of the film or series, which is often earlier than the year I subtitled it.
  talks: |
    Invited talks, keynotes, round tables and conference papers since 2000, in English, Greek and Spanish.

    In the last few years most invitations have been about artificial intelligence in subtitling and translation. The earlier talks are about subtitling norms, multilingual films, and subtitling in language teaching.

    Where a recording exists, you can watch it here. For the other talks you see the first slide of my presentation.
  research: |
    My publications, the most recent first. They are about four subjects:

    - how subtitles are written, and what they leave out
    - how films with more than one language are translated
    - subtitling and revoicing as activities for learning a language
    - since 2025, artificial intelligence in education and audiovisual creation

    My doctoral thesis, *Subtitling Norms in Greece and Spain* (Universitat Autònoma de Barcelona, 2011), compares the two countries on two points: what film subtitles omit, and how the dialogue is divided into subtitles.
  journal: |
    Longer posts, most of them first published on LinkedIn. I keep them here so that anyone can find and read them without an account.
  notes: |
    Short posts from X and LinkedIn, from 2012 until today, the newest first. Each one records what I thought on a particular day. I would write some of them differently now.
  teaching: |
    I have taught since 2000. At the Hellenic Open University I teach Spanish. In postgraduate programmes and professional courses in Greece, Spain, Italy and Argentina I have taught subtitling, audiovisual translation and translation technology.

    With colleagues at UNED in Madrid I have also taken part in teaching-innovation projects, in which students learn a language by subtitling, dubbing and describing video.
  projects: |
    Research projects I have coordinated or taken part in since 2003. Most of them were funded by the European Union.

    From 2003 to 2008 I managed projects at the Hellenic Open University. Since 2011 I have coordinated projects at the Computer Technology Institute and Press "Diophantus" (CTI).
  contact: |
    Write to me by email or on [LinkedIn](https://www.linkedin.com/in/sokoli/) about subtitling work, talks, research or teaching.

    You can write in English, Greek or Spanish.
