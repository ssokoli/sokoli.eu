name: Cache approved filmography posters
on:
  push:
    paths:
      - 'scripts/cache_filmography_posters.py'
      - '.github/workflows/cache-filmography-posters.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache-posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependencies
        run: python -m pip install --quiet requests Pillow
      - name: Download and optimize artwork
        run: python scripts/cache_filmography_posters.py
      - name: Commit local poster files and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/posters/
          if test -f _data/filmography.yml; then git add _data/filmography.yml; fi
          if test -f data/filmography.yml; then git add data/filmography.yml; fi
          if ! git diff --cached --quiet; then
            git commit -m "Cache approved subtitling artwork locally"
            git push
          fi
