title: "Stavroula Sokoli"
description: "Audiovisual translator, subtitler, researcher and educator. Research on screen translation, language learning and AI."
url: "https://sokoli.eu"
baseurl: ""
author: "Stavroula Sokoli"

markdown: kramdown
permalink: /journal/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - scripts

# Set to true to display the optional black subtitle-style statements on pages.
show_subtitles: false
