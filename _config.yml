title: "Stavroula Sokoli"
description: "Stavroula Sokoli researches audiovisual translation and subtitles films and series into Greek. She is Vice President of ESIST."
url: "https://sokoli.eu"
baseurl: ""
author: "Stavroula Sokoli"
image: "/assets/site-card.png"

markdown: kramdown
permalink: /journal/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - scripts

